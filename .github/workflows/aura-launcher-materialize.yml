name: Aura Launcher Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle/**'
      - 'android/tests/**'
      - '.github/workflows/aura-launcher-materialize.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aura-launcher-android
  cancel-in-progress: false
jobs:
  materialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate signed update manifests and offline assets
        run: |
          python3 -m unittest discover -s android/tests -v
          node --check android/app/src/main/assets/ui/phone/app.js
          node --check android/app/src/main/assets/ui/tv/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-v0.1-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
