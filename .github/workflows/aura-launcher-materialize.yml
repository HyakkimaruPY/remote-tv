name: Aura Launcher Android source and APK
on:
  push:
    branches: [main]
    paths:
      - 'android/launcher-source.tar.xz'
      - '.github/workflows/aura-launcher-materialize.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aura-launcher-android
  cancel-in-progress: false
jobs:
  materialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify source archive and unpack
        run: |
          echo "38e45deaa40485bc20948c5b16abeb16638210db3f203e08c4f2a5b36c178698  android/launcher-source.tar.xz" | sha256sum -c -
          if [ ! -f android/app/src/main/java/dev/auratv/launcher/MainActivity.java ]; then tar -xJf android/launcher-source.tar.xz; fi
          python3 -m unittest discover -s android/tests -v
          node --check android/app/src/main/assets/ui/phone/app.js
          node --check android/app/src/main/assets/ui/tv/app.js
      - name: Publish source files without modifying Philco or LG
        run: |
          git add android
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Materialize Aura Launcher 0.1 source [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-v0.1-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
