name: Validate Philco Beta 6.4 Candidate

on:
  push:
    branches:
      - feature/wasm-core-context-search
      - main
    paths:
      - '.github/workflows/philco-beta64.yml'
      - 'philco/bibliotecas/**'
      - 'system/readable/philco-search*'
      - 'system/readable/xtream-ui.beta56-6-4.js'
      - 'manifest.beta56-6-4.json'
      - 'tests/beta56-6-4.integration.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral test dependencies
        run: npm install --no-save --no-package-lock acorn@8 jsdom@24
      - name: Validate Beta 6.4 manifest, modules, WebAssembly and phone relay
        run: node tests/beta56-6-4.integration.cjs
      - name: Exercise new Xtream UI against historic LIVE regression harness
        run: |
          cp manifest.beta56-6-4.json manifest.json
          node tests/beta56-6.live.cjs
          node tests/beta56-5.live.cjs
      - name: Verify preserved baseline VOD and artwork
        run: |
          node tests/beta56-5.vod.cjs
          node tests/beta56-5.artwork.cjs
          node tests/beta56-6-1.update.cjs
