name: Validate Philco Continue 6.5.4
on:
  push:
    branches: [main, fix/continue-resume-654]
    paths:
      - '.github/workflows/philco-continue654.yml'
      - '**/*beta56-6-5-4*'
      - 'manifest.json'
      - 'version'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock jsdom@24 acorn@8
      - name: Verify complete candidate integrity and ES5
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),crypto=require('crypto'),acorn=require('acorn');
          const m=JSON.parse(fs.readFileSync('manifest.json'));
          assert.deepEqual(m,JSON.parse(fs.readFileSync('manifest.beta56-6-5-4.json')));
          assert.equal(m.version,'0.56-beta.6.5.4');
          assert.ok(['0.56-beta.6.5.3',m.version].includes(fs.readFileSync('version','utf8').trim()));
          for(const x of m.modules){const b=fs.readFileSync(x.path);assert.equal(b.length,x.bytes,x.path);assert.equal(crypto.createHash('sha256').update(b).digest('hex'),x.sha256,x.path);if(x.type==='js')acorn.parse(b.toString(),{ecmaVersion:5});}
          console.log('PASS',m.modules.length,'modules: hashes, bytes, ES5 and marker');
          JS
      - name: Direct Continue, category actions, episode identity and confirmed resume
        run: node tests/beta56-6-5-4.resume.cjs
      - name: Adjacent live, artwork, navigation and VOD baseline regressions
        env:
          RTV_APP_SOURCE: apps/player1/app.beta56-6-5-2.js
          RTV_UI_SOURCE: system/readable/xtream-ui.beta56-6-5-4.js
          RTV_VOD_SOURCE: system/readable/xtream-vod-player.beta56-6-5-4.js
        run: |
          node tests/beta56-6-5-3.vod.cjs
          node tests/beta56-6-5-2.refine.cjs
          node tests/beta56-6.live.cjs
          node tests/beta56-5.live.cjs
          node tests/beta56-5.artwork.cjs
          node tests/beta56-5.vod.cjs
